@let appearanceValue = appearance();
@for (item of items(); track item) {
  <div
    class="skeleton-loader"
    [class]="classes()"
    aria-hidden="true"
    [style]="styles()"
    [style.--ngx-skeleton-loader-index]="item || null"
    >
    @if (appearanceValue  === 'custom-content') {
      <ng-content></ng-content>
    }
  </div>
}
