name: Setup project
description: Sets up Node.js (version from `.nvmrc`, with npm cache) and installs the dependencies

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
